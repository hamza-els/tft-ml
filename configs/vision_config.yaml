# Vision pipeline configuration
# All pixel regions assume 1920x1080 source resolution.

source_resolution: [1920, 1080]
frame_sample_fps: 1.0   # frames to extract per second of VOD

# NOTE: every region below is calibrated for one HUD layout (BoxBox's stream,
# VOD knB6dE8Rbgg). Another streamer / UI scale needs its own calibration —
# check with scripts/preview_regions.py, measure with scripts/calibrate_regions.py.

hud:
  template_dir: "assets/templates/hud"   # stage_icon.png, gold_icon.png
  match_threshold: 0.80
  stage_icon_search: [600, 0, 500, 40]   # the stage bar shifts right during stage 1
  # The bottom bar (level, XP, gold, streak, shop) is not always in the same
  # place: in later VODs (patch 18.6) it sits ~105 px further left. The gold
  # coin is searched along the bar, and every bottom-bar region below is
  # shifted by (found x - gold_icon_x). The values below are for the
  # calibration VOD, where the coin's top-left is at x = 1002.
  gold_icon_search:  [760, 874, 400, 40]
  gold_icon_x: 1002
  # Known bottom-bar positions (shift from calibration). The coin itself moves
  # a few px with the number of gold digits, so the measured shift is snapped
  # to the nearest of these. Add a value here if a new layout shows up.
  bottom_bar_offsets: [0, -105]
  stage_one_min_x: 770                   # icon x >= this means the stage-1 bar layout

ocr:
  # All regions are (x, y, w, h) for 1920x1080
  regions:
    gold:   [1028, 878, 56, 32]
    level:  [386, 878, 38, 32]    # digit only, after "Lvl."
    streak: [1140, 876, 44, 34]   # number only; icon colour gives the sign
    xp:     [462, 880, 62, 28]    # text format "X/Y"

  # Stage text ("3-2") sits right of the stage icon, which moves in stage 1,
  # so its region is an offset (dx, dy, w, h) from the icon's top-left corner.
  stage_text_offset: [26, -2, 46, 30]

  # Streak flame icon: red = win streak, blue = loss streak.
  streak_icon: [1106, 880, 26, 28]

  # Right-hand player list. The player's own HP is the large number; the
  # small numbers further right are the other players' HP.
  hp_strip: [1770, 160, 100, 650]
  hp_own_x: [1775, 1815]          # left edge of the own-HP text falls in this range
  hp_own_min_height: 15
  hp_others_min_x: 1820
  hp_max: 150                     # HP can exceed 100 with some augments
  # A panel can replace the player list: the "Damage Dealt" recap during fights,
  # or a unit's info panel. Both have the same flat dark-teal background.
  # With a panel open only the top band is read: the damage recap keeps the
  # player's own HP there; a unit info panel shows no HP at all.
  # Matched by exact colour, not darkness: dark arenas and black stream
  # backgrounds are just as dark but never this flat teal (measured on 4 VODs:
  # lists <= 0.07 of the zone, panels >= 0.25).
  hp_panel_zone: [1700, 300, 160, 480]
  hp_panel_color: [33, 33, 21]    # BGR
  hp_panel_tolerance: 6           # max per-channel difference to count as panel colour
  hp_panel_share: 0.15            # share of panel-coloured pixels in the zone that means "panel"
  hp_top_band: [1770, 160, 100, 80]

  # Champion-name text on each shop card, left to right (card pitch is 202 px).
  # Each region stops short of the cost coin.
  shop_slots:
    - [556, 1042, 150, 30]
    - [758, 1042, 150, 30]
    - [960, 1042, 150, 30]
    - [1162, 1042, 150, 30]
    - [1364, 1042, 150, 30]

  # Current-set champion names, one per line (scripts/build_champion_list.py).
  # Shop OCR snaps to the closest entry; without the file, raw text is returned.
  champion_list: "assets/champions.txt"

champion_detector:
  weights: "assets/yolo_tft.pt"   # path to trained YOLOv8 weights
  conf_threshold: 0.50
  # Vertical split by box centre (fraction of frame height).
  # Below bench_max_ratio is the shop strip — read by OCR, detections dropped.
  board_max_ratio: 0.60
  bench_max_ratio: 0.80

template_matching:
  item_dir: "assets/templates/items"
  confidence_threshold: 0.82

game_data:
  set: "TFTSet18"                      # scripts/fetch_game_data.py -> assets/game_data/<set>.json
  # Units that can stand on the board or bench but are never sold in the shop,
  # so they are missing from the set's champion list. Hand-maintained per set
  # (from trait and augment descriptions). They have no cost and no traits.
  extra_units:
    - Stonebark Tree                   # Elderwood (also the Potted Stonebark augment)
    - Lifebloom                        # Elderwood (also the Potted Lifebloom augment)
    - Deepwood Protector               # Elderwood
    - Big Furry Friend                 # Sprykin
    - Training Dummy                   # Found Friend / Returning Friend / Dummify augments
    - Golem                            # Golemify augment, Golem assist item
  # Names folded into another unit (Hamza, 2026-11-23): Small Furry Friend (from its augment)
  # has the same picture as Big Furry Friend, only less health; two Big Furry Friends on the
  # board mean one is the small one, and the augment in the state says so. One ID for both.
  unit_aliases:
    Small Furry Friend: Big Furry Friend
  # Items the set's item list leaves out (trait-granted, no official art on
  # Community Dragon), so the labelers can name their footage templates and
  # the token table gives them an ID. Hand-maintained per set. Checked
  # 2026-11-22: every Set 18 trait and the set's item list; the only real
  # item missing was Riftbeast's (the other 10 missing are debug items).
  extra_items:
    - Alpha Mark                       # Riftbeast: "Use the Alpha Mark to grant a Riftbeast their unique Buff"

# Augment bar: up to three icons above the board, centred on center_x.
# One icon wide after the first pick, growing to three; absent before that.
# When the camera is on someone else's board (scouting or an away fight) the
# view is flipped and that player's bar is drawn on the right instead.
augments:
  center_x: 510
  y: 228
  away_center_x: 1390                  # the same bar when viewing another player's board
  away_y: 268
  height: 38
  slot_width: 37.5
  max_slots: 4                         # 3 picks, plus a possible 4th from some effects
  dark_below: 60                       # bar background is near-black
  match_threshold: 0.80
  art_match_threshold: 0.60           # templates rendered from official art (art__*, augments never seen in footage): the right render scores ~0.78
  template_dir: "assets/templates/augments_v2"   # medoid templates named directly (scripts/build_augment_templates.py); the old harvest set is assets/templates/augments

# Unequipped items: column of square slots on the left edge.
item_column:
  # Each window is the whole slot including its gold outline; matching uses
  # the icon inside it (the window shrunk by `outline` px on every side).
  x: 10
  y: 261
  slot_size: 46
  slot_pitch: 54                       # measured from empty slots: tops at 261, 315, 369, ...
  outline: 2
  slots: 9                             # the 10th slot is rarely used and overlays cover it
  empty_below: 25                      # mean brightness of an empty (black) slot
  min_contrast: 30                     # below this the slot shows flat scenery, not an icon
  match_margin: 4                      # px trimmed from each edge before matching
  seen_dir: "assets/templates/items_seen"   # icons cut from footage (harvest_item_icons.py)
  seen_threshold: 0.85                 # match against icons cut from footage
  official_threshold: 0.75             # match against official art (weaker likeness)
  # The column is found per frame (it sits ~4 px left on ~1% of frames) within this many px,
  # and a slot is read only when its frame (dark line + gold) shows on every side at least
  # this strongly (left, right, top, bottom steps on the brightest channel, better half of
  # each edge; clean slots: 1st percentile 79 / 19 / 100 / 45). Dragged, hovered or covered
  # items fail and are read as None. A slot more than empty_dark near-black is empty (an
  # empty slot with the cursor over it).
  align_search: 6
  edge_channel: max
  edge_min: [40, 0, 50, 20]
  empty_dark: 0.5

# Bench: nine fixed slots along the bottom of the board.
bench:
  first_center_x: 427
  slot_pitch: 116.5
  slots: 9
  crop_width: 116
  y: 680                               # top of the crop (includes the unit's health bar)
  height: 140
  # Unit crops (what the classifier sees). Units lean away from the screen
  # centre with perspective, so each window is centred on
  #     cx + shift + lean * (cx - 960)
  # (fitted to the health-bar centres of 1,323 labelled bench units), half_width
  # either side, and reaches pad_top above the slot window. Sized so the star
  # badge is inside for 97.5% of units.
  window: {lean: 0.0387, shift: 1.5, half_width: 70, pad_top: 16}

# Player's half of the board: 4 rows of 7 hexes. The camera looks down at an
# angle, so rows nearer the bottom are wider. Each row: x of its first hex
# centre, spacing between centres, and y of the centres (row 0 = front row,
# nearest the enemy).
board:
  # Unit crops (what the classifier sees), per row: units lean away from the
  # screen centre with perspective (more on nearer rows), so each window is
  # centred on cx + win_shift + win_lean * (cx - 960), window_half_width either
  # side, reaching win_top above the hex region. Fitted to the health-bar
  # centres of 2,488 labelled board units; the star badge is inside for 97.5%.
  rows:
    - {first_x: 559, pitch: 116.7, y: 439, win_lean: 0.0272, win_shift: -3.7, win_top: 14}
    - {first_x: 616, pitch: 117.7, y: 514, win_lean: 0.0514, win_shift: -5.4, win_top: 10}
    - {first_x: 534, pitch: 122.5, y: 586, win_lean: 0.0490, win_shift: 1.0, win_top: 12}
    - {first_x: 587, pitch: 126.2, y: 655, crop_below: 52, win_lean: 0.0588, win_shift: -1.7, win_top: 10}   # nearest row: units drawn larger, feet lower
  cols: 7
  window_half_width: 66
  # Region around a hex (occupancy and bar search), relative to the hex centre.
  crop_width: 124
  crop_above: 130                      # includes the health bar
  crop_below: 34                       # default; a row can override it

# Health bar above each own unit, and the star badge / items hanging off it
# (src/vision/unit_bar.py). Offsets are from the bar's left end and top edge.
unit_bar:
  x_offset: -32.3                      # bar_left = cx + x_offset + x_lean * (cx - 960)
  x_lean: 0.0425
  max_dx: 22                           # bars starting further than this from the expected x belong to a neighbour
  min_width: 25
  search_above: 30                     # how far above the hex/slot window to look for the bar
  search_below: 110                    # how far below the window top
  badge: [-26, -12, 30, 28]            # star badge box (= template size): dx, dy, w, h
  badge_slack: [3, 2]                  # the template may sit this many px off in x, y
  star_templates: assets/templates/stars
  # A star level is only given when the best template scores at least this
  # and beats the runner-up by the margin. On 3,591 labelled units: 98% read,
  # 36/36 of the hardest accepted ones right by eye; the rest are badges half
  # hidden behind a panel or the screen edge.
  star_min_score: 0.35
  star_min_margin: 0.10
  # A green bar only counts as a unit's when some star template scores at
  # least this at its badge position: the Little Legend's nameplate bar has a
  # level box there instead.
  badge_min_score: 0.35
  # ...or at least weak_badge_score when the bar has a unit bar's shape and colour (unit_bar.is_unit_bar):
  # height and width in px (planning: full health), and mean blue and red of its green pixels at most
  # this (unit bars ~40, the nameplate's mint bar ~65-130). weak_badge_score 1.0 turns this off.
  weak_badge_score: 0.15
  unit_bar_height: [3, 6]
  unit_bar_width: [56, 68]
  unit_bar_max_blue_red: 70
  # Bar finding (unit_bar._bars_in_mask): bridge 1-2 px gaps along a row (tick marks on tanky
  # units' bars split them), and split a blob of two touching stacked bars into its bands.
  bridge_gaps: true
  split_stacked: true
  # Bars no hex claimed (a unit being dragged or off its hex; unit_reader.loose_bars).
  # Board bars' tops span y 299-619 (measured on 150 frames), bench bars start at 654.
  loose:
    zone: [420, 280, 1100, 360]        # x, y, w, h: the board area where such bars are looked for
    bar_top: [31, 29, 41, 42]          # usual bar top below each row's hex region top (median)
    max_distance: 180                  # px from a free hex's usual bar position; further = not assigned
  # A champion riding the Big Furry Friend (Sprykin) has its own bar just above the BFF's
  # (unit_reader.rider_bars): upper bar top minus lower bar top in dy, left minus left in dx.
  # Measured 2026-11-23 on 39 rider pairs: about dy -21, dx -6; 4 non-Sprykin games had no
  # such pair. Before this the hex behind took the rider's bar (12 of 39) or it went loose.
  rider:
    dy: [-32, -10]
    dx: [-20, 5]
    # ...or tightly stacked (2026-11-24): the rider's bar 3-8 px over the BFF's, one badge (the lower
    # bar's), the upper bar without one. Seen in Cu-Mg0jpCSs/game_02 (dy -5, dx -5; Rengar riding).
    tight_dy: [-8, -3]
    tight_dx: [-12, 3]
    # ...or high (2026-11-24, Hamza: Veigar riding a BFF on h36, ZXj0GIXDaV0/game_07): the BFF's bar so
    # high over its hex that no hex claims it, the rider's 85-95 px above. Only between bars no hex
    # claimed: two units two rows apart (both claimed) sit 110-140 px apart.
    high_dy: [-100, -60]
    high_dx: [-20, 20]
    high_drop: 85                      # a high BFF's bar sits 77-95 px over its hex's usual bar spot
  item_dx: -9                          # first item icon: dx, dy from the bar; icons are item_size square
  item_dy: 12
  item_size: 25
  item_pitch: 26
  item_slack_x: 2                      # icons can sit this many px off sideways (bar end found +-2 px)
  item_margin: 2                       # px trimmed off each side of an icon before matching
  item_templates: assets/templates/unit_items   # cut from footage by scripts/harvest_unit_item_icons.py
  # An item slot holds an item when the icon matches an item template: with
  # its dark outline found (outline score: scenery ~0, icons mostly 0.5+) at
  # item_min_score, or without at item_sure_score. An outline alone is not an
  # item (it was: 71 false items on Hamza's labels, no real ones).
  outline_dark: 80                     # outline pixels are darker than this (max channel)
  outline_contrast: 25                 # ...and the scenery just outside is this much lighter
  item_min_outline: 0.5
  item_sure_score: 0.80                # a match this strong is an item even without a visible outline (shape x colour score)
  item_min_score: 0.60                 # match needed to name an outlined item (outlined items: median 0.92, 95% above 0.68)
  item_maybe_outline: 0.30             # some sign of an icon: counts only right before a clear item (items fill from the left)
  item_maybe_score: 0.40
  # Item classifier (src/vision/item_classifier.py): its answer is taken when this sure, else the
  # template matcher decides. Held-out: every item it was trained on >= 0.97, unseen items <= 0.92.
  item_model_confidence: 0.97

# Own-board and planning-phase detection (src/vision/arena.py).
arena:
  # Scenery patches around the board (x, y, w, h) whose colour identifies the arena skin.
  patches:
    - [1440, 700, 100, 80]
    - [1450, 300, 100, 80]
    - [330, 600, 70, 80]
    - [900, 150, 120, 40]
  max_distance: 15                     # mean colour difference from the game's usual arena
  # Far part of the board, stopping above where the player's own front-row
  # health bars are drawn. Empty during planning.
  enemy_half: [460, 150, 1000, 150]
  max_bar_pixels: 150                  # allows for stray effects; a single enemy bar is ~500
  combat_veto: 0.3                     # frame classifier's combat probability at or above which a "planning" frame is a fight,
                                       # unless the units/team-size counter was read (arena.combat_vetoed)
  # Round timer bar under the stage bar: drains as the clock runs down and
  # refills when the next phase starts.
  timer_bar: [600, 43, 700, 10]
  timer_bar_length: 435                # px when full (normal layout)
  timer_refill: 0.12                   # rise in fill that marks a new phase
  timer_empty: 0.02                    # fill at or below this = planning is ending, units turn to fight
  # "Combat" banner under the stage bar at the start of each fight (arena.combat_banner).
  combat_word: assets/templates/hud/combat_word.png
  combat_banner_zone: [850, 110, 230, 90]
  combat_banner_score: 0.65
  # "Planning" banner at the same spot (arena.planning_banner_score): ~0.99 when up, < 0.55 otherwise.
  planning_word: assets/templates/hud/planning_word.png
  planning_banner_score: 0.65

# Board counter "units / team size" in the middle of the arena during
# planning (src/vision/board_counter.py). Regions are x ranges inside the
# strip; the slash stays put, "10" just reaches further out on both sides.
board_counter:
  strip: [800, 210, 440, 120]          # x, y, w, h in the frame
  rows: [5, 115]                       # y range of the digits inside the strip
  regions:
    left_one: [80, 200]                # one-digit unit count, left of the slash
    left_two: [10, 200]                # "10"
    right_one: [235, 350]              # one-digit team size, right of the slash
    right_two: [240, 430]
  slack: 8                             # px the text may sit off in any direction
  templates: assets/templates/board_counter   # scripts/build_counter_templates.py
  min_score: 0.45
  min_margin: 0.05
  max_red_pixels: 30                   # enemy health bars over the counter (PvE monsters): don't read it

# Tooltip panels over the board (src/vision/tooltip.py): dark, flat, rectangular.
tooltip:
  area: [280, 120, 1360, 760]          # x, y, w, h searched (board and bench)
  scale: 4                             # work at 1/4 size
  dark_below: 40                       # panel background: every channel below this
  close_px: 24                         # closes the gaps left by the panel's text
  min_size: [140, 60]                  # w, h in frame pixels
  min_fill: 0.80                       # component area / bounding box: panels are rectangles
  covered_share: 0.25                  # a unit window this much under a panel is "covered"
  crop_panel_rows: 0.40                # or: this share of a crop's lower rows mostly near-black (tooltip.panel_in_crop)
